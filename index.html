<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a fixed left rail and one working column. The month switcher is the only filter and sits above everything it scopes.
     Data lives in ruled ledger tables, not cards. The one loud element is the meter drum (odometer digits). */
  --paper:#FFFFFF; --surface:#FFFFFF; --sunken:#F0F3F5; --side:#F4F6F8;
  --ink:#0C181F; --ink-2:#394952; --ink-3:#5F6F78; --line:#C6D0D6;
  --accent:#2C3A96; --accent-ink:#FFFFFF; --accent-wash:#E8EBFA;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --crit-ink:#B42C2C;
  --s-rent:#2a78d6; --s-elec:#eb6834; --s-water:#1baf7a; --s-other:#eda100; --heat:#256abf;
  --font:"Anuphan","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --doc:"Sarabun","Anuphan","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;font-weight:600;text-wrap:balance}
h3{font-size:14px;font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sub{color:var(--ink-2);font-size:14.5px}
.hint{color:var(--ink-3);font-size:14px;margin-top:8px}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px}
.brand-name{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.brand-sub{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;border-left:3px solid transparent}
.nav a:hover{background:var(--sunken);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-wash);color:var(--accent);border-left-color:var(--accent)}
.save{margin-top:auto;padding:0 8px;font-size:13.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.save b{font-weight:600;color:var(--ink-2)}
.save.bad b{color:var(--crit-ink)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);min-height:62px}
.month{display:flex;align-items:center;gap:4px}
.month select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-weight:600;min-width:170px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:36px;cursor:pointer;font-size:16px;line-height:1}
.icon-btn:hover:not(:disabled){background:var(--sunken)}
.icon-btn:disabled{opacity:.4;cursor:default}
.top-space{flex:1}
.banner{margin:16px 28px 0;padding:12px 16px;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1;min-width:220px}
.view{padding:26px 28px 60px;display:flex;flex-direction:column;gap:26px;max-width:1180px;width:100%}
.head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.head > div:first-child{flex:1;min-width:220px}
.head .sub{margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sunken)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.12)}
.btn-danger{color:var(--crit-ink)}
.btn-sm{padding:6px 11px;font-size:14px}

.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--side);border:1px solid var(--line);border-radius:8px}
.fig{padding:16px 20px;border-left:1px solid var(--line)}
.fig:first-child{border-left:0}
.fig-l{color:var(--ink-2);font-size:14.5px}
.fig-v{font-size:26px;font-weight:700;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.fig-s{color:var(--ink-3);font-size:14px;margin-top:2px}
.collect{display:flex;flex-direction:column;gap:6px}
.track{height:8px;border-radius:99px;background:var(--accent-wash);overflow:hidden}
.track > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.attn{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.attn li{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.attn li:first-child{border-top:0}
.attn .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--ink-3)}
.attn .crit .ic,.ic.crit{background:var(--crit)}
.attn .warn .ic{background:var(--warn);color:#16232A}
.attn .txt{flex:1;min-width:0}
.attn .txt b{display:block;font-weight:600}
.attn .txt span{color:var(--ink-2);font-size:14.5px}
.empty{padding:22px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 10px 6px;min-width:0}
.chart svg{display:block;max-width:100%}
.chart text{font-family:var(--font);font-size:12.5px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.chart .val{fill:var(--ink);font-weight:600;font-size:13px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--ink-3);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover,.chart .hit:focus{fill:var(--ink);fill-opacity:.06;outline:none}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.45;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.tip .t{font-weight:600;margin-bottom:3px}
.tip .r{display:flex;gap:10px;justify-content:space-between;align-items:center}
.tip .r b{font-variant-numeric:tabular-nums}
.tip .k{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl thead th{border-top:0;font-weight:600;color:var(--ink-2);font-size:14px;white-space:nowrap;background:var(--sunken)}
.tbl thead .grp th{border-bottom:0;padding-bottom:0;color:var(--ink)}
.tbl tbody th{font-weight:600}
.tbl tbody th a{text-decoration:none}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tfoot td,.tbl tfoot th{font-weight:700;background:var(--sunken)}
.tbl .sub{font-weight:400;font-size:13.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.is-vacant th,.tbl tr.is-vacant td{color:var(--ink-3)}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td,.tbl tr.clickable:hover th{background:var(--sunken)}
.tbl .gl{border-left:1px solid var(--line)}
.rd{width:92px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--surface);font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.rd:disabled{background:var(--sunken);color:var(--ink-2)}
.rd.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,var(--surface))}

.drum{display:inline-flex;gap:1px;padding:2px;border-radius:4px;background:#0f1417;border:1px solid #3a454c;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;line-height:1}
.drum b{display:inline-grid;place-items:center;width:14px;height:20px;background:#22292e;color:#f4f6f7;border-radius:2px;font-weight:600}
.drum b.t{background:#c0392f;color:#fff}
.drum.w{background:#c9d2d7;border-color:#aab6bd}
.drum.w b{background:#fbfcfc;color:#16232A}
.drum.w b.t{background:#fbfcfc;color:#c0392f}
.drum.lg{font-size:17px}
.drum.lg b{width:19px;height:27px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 8px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.pill i{font-style:normal;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:var(--ink-3)}
.pill.paid i{background:var(--good)} .pill.paid{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.pill.overdue i{background:var(--crit)} .pill.overdue{border-color:color-mix(in srgb,var(--crit) 50%,var(--line));color:var(--crit-ink)}
.pill.partial i{background:var(--warn);color:#16232A}
.pill.due i{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.util{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.util > div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lab{font-size:14px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);width:100%;min-width:0}
.field small{color:var(--ink-3);font-size:13.5px}
.verdict{font-size:14.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.verdict b{color:var(--ink)}
.verdict .over{color:var(--crit-ink)}

.floor{display:flex;flex-direction:column;gap:10px}
.floor h2{color:var(--ink-2);font-size:14px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.room{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink);border-top:4px solid var(--accent)}
.room.vac{border-top-color:var(--line);background:transparent;border-style:dashed;border-top-style:solid}
.room:hover{box-shadow:0 2px 0 var(--line)}
.room .no{font-size:22px;font-weight:700;line-height:1.1}
.room .who{font-size:14.5px;color:var(--ink-2);min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .rent{font-size:14px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px}
.facts > div{padding:12px 16px;border-left:1px solid var(--line);margin-left:-1px}
.facts dt{font-size:14px;color:var(--ink-2)}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.heat td.h{font-variant-numeric:tabular-nums;text-align:right;min-width:54px}
.heat td.h.on{color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px}

.modal-bg{position:fixed;inset:0;background:rgba(10,16,20,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:100%;max-width:520px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
.modal-head{display:flex;gap:12px;align-items:flex-start}
.modal-head h2{flex:1;font-size:19px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* The bill is a paper document read on a phone: one column, the amount to pay first. */
.sheet-wrap{display:flex;justify-content:center}
.sheet{font-family:var(--doc);background:#fff;color:#141c21;border:1px solid #c6d0d6;border-radius:10px;padding:24px 26px;width:100%;max-width:560px;font-size:16px;line-height:1.45}
.sheet.rc{background:#FDF1F4}
.sh-top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.sh-org b{font-size:19px;line-height:1.25;display:block}
.sh-org div,.sh-kind div{color:#4b5a62;font-size:14px}
.sh-kind{text-align:right;white-space:nowrap}
.sh-kind b{font-size:18px;display:block}
.sh-who{display:flex;gap:12px;justify-content:space-between;align-items:baseline;margin-top:16px;font-size:17px;flex-wrap:wrap}
.sh-who span{color:#4b5a62}
.sh-due{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin:14px 0 6px;padding:16px 18px;border-radius:10px;background:#EEF1FB}
.sheet.rc .sh-due{background:#E0F2E4}
.sh-due .lb{color:#4b5a62;font-size:14.5px}
.sh-due .amt{font-size:34px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.sh-due .by{text-align:right}
.sh-due .by b{font-size:17px}
.ln{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid #dfe5e9}
.ln .nm span{color:#4b5a62;font-size:14px}
.ln .dt{color:#4b5a62;font-size:14.5px;margin-top:1px}
.ln .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln.tot{border-top:2px solid #141c21;font-size:18.5px}
.ln.sm{border-top:0;padding:2px 0}
.ln.sm .am{font-weight:500}
.sh-pay{margin-top:12px;padding-top:12px;border-top:1px solid #dfe5e9;font-size:14.5px;color:#2c373d}
.paylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.paylist li{display:flex;gap:10px;align-items:center;font-size:14px}
.paylist li span{flex:1}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-form .field{flex:1;min-width:120px}
.loading{padding:60px 28px;color:var(--ink-2)}
.bulk{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.bulk input{width:110px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:right;background:var(--surface)}

[hidden]{display:none !important}
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--side)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login-card h1{font-size:26px}
.login-msg{font-size:14.5px;color:var(--crit-ink);margin:0}
.login-msg.ok{color:var(--good-ink)}
.btn-link{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;text-align:left;font-weight:500;text-decoration:underline}
.bpick{margin:12px 0 6px;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.bpick label{font-size:13.5px;color:var(--ink-3)}
.bpick select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-weight:600;width:100%;min-width:0}
.navbtn{margin-top:10px;background:none;border:0;text-align:left;padding:8px 13px;color:var(--ink-2);cursor:pointer;font-weight:500;border-radius:6px;white-space:nowrap}
.navbtn:hover{background:var(--sunken);color:var(--ink)}
.top-b{font-size:16px}
.top-t{color:var(--ink-2);font-weight:600}
.blist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.brow{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr) minmax(0,3fr) auto;gap:16px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.brow:first-child{border-top:0}
.brow:hover{background:var(--sunken)}
.brow b{display:block;font-size:17px;overflow-wrap:anywhere}
.brow .sub{display:block}
.brow .amt{text-align:right}
.brow .go{color:var(--accent);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.steps li{border-left:1px solid var(--line)}
.steps li:first-child{border-left:0}
.step{display:flex;gap:10px;align-items:center;padding:12px 14px;text-decoration:none;color:var(--ink);height:100%}
.step:hover{background:var(--sunken)}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--line);color:var(--ink-2)}
.step.done .n{background:var(--good);border-color:var(--good);color:#fff}
.step.now{background:var(--accent-wash)}
.step.now .n{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.step b{display:block;font-weight:600}
.step .sub{display:block}
.neg{color:var(--crit-ink)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding:12px 16px 0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0}
  .brand-sub{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;margin:0 -16px;padding:0 16px}
  .nav a{border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap;padding:8px 12px}
  .nav a[aria-current="page"]{border-bottom-color:var(--accent)}
  .save{margin:0;padding:0 0 8px;flex-direction:row;align-items:center}
  .top{padding:10px 16px}
  .banner{margin:12px 16px 0}
  .view{padding:18px 16px 50px;gap:22px}
  .band{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fig:nth-child(3){border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .cols,.util,.two{grid-template-columns:minmax(0,1fr)}
  .bpick{margin:0;padding:0 8px;border-top:0;flex-direction:row;align-items:center;flex:none}
  .bpick label{display:none}
  .bpick select{width:auto;max-width:190px;padding:6px 8px}
  .navbtn{margin:0}
  .steps{grid-auto-flow:row}
  .steps li{border-left:0;border-top:1px solid var(--line)}
  .steps li:first-child{border-top:0}
  .brow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}

<script>

/* ---------- billing maths (one place, used by every screen) ---------- */
function calc(p, rid) {

/* ---------- storage ---------- */

function docData(path) {
